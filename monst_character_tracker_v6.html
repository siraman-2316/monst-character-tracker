<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モンストキャラ管理</title>
<style>
:root{--bg:#fff;--surface:#fff;--soft:#f6f7f8;--line:#e5e7eb;--text:#202124;--muted:#73777f;--fire:#d94d45;--water:#347fc5;--wood:#398653;--light:#a27a13;--dark:#7851b7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main{max-width:960px;margin:auto;padding:16px}h1{font-size:23px;margin:0 0 5px}small,.muted{color:var(--muted)}button,input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--text);padding:10px}button{font-weight:600;cursor:pointer}button.primary{background:#222;color:white;border-color:#222}button.soft{background:var(--soft)}button.danger{color:#c43d37}.toolbar,.stats,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr)}.stat{border:1px solid var(--line);border-radius:12px;padding:10px}.stat strong{display:block;font-size:20px}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab{white-space:nowrap}.tab.active{background:#222;color:#fff}.toolbar input{flex:1;min-width:170px}.grid{display:grid;grid-template-columns:1fr;gap:8px}.card{border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer}.cardrow{display:flex;align-items:center;gap:10px}.element-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}.name{font-weight:750}.badge{margin-left:auto;background:var(--soft);border-radius:99px;padding:5px 9px;font-size:12px;white-space:nowrap}.chip{border-radius:99px;padding:7px 10px;font-size:12px}.chip.active{background:#222;color:#fff}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.hidden{display:none!important}.panel{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.copy{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.copytiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.copytile{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 6px;text-align:center;min-width:0}.copytile.selected{border:2px solid #222;background:#f5f5f5}.copytile .num{font-weight:800;font-size:18px}.copytile .acct{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:4px}.copytile .state{font-size:11px;margin-top:5px}.copytabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.copytabs button{white-space:nowrap}.copytabs button.active{background:#222;color:white}.detailhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.progressbar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:6px 0}.progressbar span{display:block;height:100%;background:#40a36b}.navcopies{display:flex;justify-content:space-between;gap:8px;margin:12px 0}.fruit{display:inline-block;border:1px solid #ddd;background:white;border-radius:7px;padding:5px 8px;margin:3px;font-size:12px}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:5px}.checklist label{display:flex;align-items:center;gap:6px}.checklist input{width:auto;padding:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formgrid label{display:grid;gap:4px;font-size:13px;color:var(--muted)}.formgrid input,.formgrid select,.formgrid textarea{width:100%}dialog{border:1px solid var(--line);border-radius:16px;padding:15px;width:min(760px,calc(100% - 16px));max-height:92vh;overflow:auto;background:white;color:var(--text)}dialog::backdrop{background:#0006}.copyeditor{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.editorcopytiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0}.editorcopytile{padding:8px 4px;text-align:center;min-width:0}.editorcopytile.active{background:#222;color:#fff;border-color:#222}.editorcopytile small{display:block;font-size:11px;margin-top:3px}.editorcopytile.active small{color:#ddd}.editorsection{position:sticky;top:0;background:white;padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}dialog .foot{position:sticky;bottom:-15px;background:white;padding:10px 0;z-index:3;border-top:1px solid var(--line)}.copyeditor h3{margin:0 0 10px}.fruitchecks{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:10px}.fruitchecks label{display:flex;align-items:center;gap:5px;font-size:13px}.fruitchecks input{width:auto;padding:0}.planned{border-left:3px solid #888;padding-left:8px;margin:5px 0}.task{padding:8px;border-bottom:1px solid var(--line)}.task label{display:flex;gap:8px;align-items:center}.task input{padding:0}.priority{font-size:12px;font-weight:700}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.fruitchecks,.checklist{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>🎮 モンスト キャラ管理</h1><p class="muted">4アカウント・個体別厳選・育成計画をまとめて管理</p></header>
<main>
<section id="home">
<div class="stats">
<div class="stat"><strong id="totalChars">0</strong><small>登録キャラ</small></div>
<div class="stat"><strong id="ownedChars">0</strong><small>所持キャラ</small></div>
<div class="stat"><strong id="totalCopies">0</strong><small>所持個体数</small></div>
<div class="stat"><strong id="todoCount">0</strong><small>未完了タスク</small></div>
</div>
<div class="tabs">
<button class="tab active" data-view="list">キャラ一覧</button><button class="tab" data-view="today">今日やること</button><button class="tab" data-view="unfinished">未完成一覧</button><button class="tab" data-view="plans">将来つけたい実</button>
</div>
<div id="listView">
<div class="toolbar">
<input id="search" placeholder="🔍 キャラクター名で検索">
<select id="accountFilter"><option value="">アカウント：すべて</option></select>
<select id="categoryFilter"><option value="">区分：すべて</option><option>限定</option><option>恒常</option><option>コラボ</option></select>
<select id="priorityFilter"><option value="">優先度：すべて</option><option>🔴 最優先</option><option>🟠 優先</option><option>🟡 余裕あれば</option><option>⚪ 保留</option></select>
<select id="sort"><option value="added">登録順</option><option value="figureAsc">図鑑番号 ↑</option><option value="figureDesc">図鑑番号 ↓</option><option value="name">名前順</option><option value="updated">更新順</option></select>
<button class="primary" id="addBtn">＋ キャラ登録</button><button id="backupBtn">バックアップ</button><button id="importBtn" class="soft">復元</button>
</div>
<div class="filters"><button class="chip active" data-status="all">すべて</button><button class="chip" data-status="owned">所持</button><button class="chip" data-status="unowned">未所持</button><button class="chip" data-status="unfinished">未完成</button><button class="chip" data-status="priority">優先</button><button class="chip" data-status="threeAttack">3加撃完成</button></div>
<div id="accountSettings" class="filters"></div><div id="grid" class="grid"></div>
</div>
<div id="todayView" class="hidden"></div><div id="unfinishedView" class="hidden"></div><div id="plansView" class="hidden"></div>
</section>
<section id="detail" class="hidden"><button id="back" class="soft">← 一覧へ</button><div id="detailContent"></div></section>
</main>
<dialog id="editor"><h2 id="editorTitle">キャラ登録</h2>
<div class="formgrid">
<label>キャラ名<input id="name"></label><label>属性<select id="element"><option value="">未設定</option><option>火</option><option>水</option><option>木</option><option>光</option><option>闇</option></select></label>
<label>レア度<select id="rarity"><option>★6</option><option>★5</option><option>★4</option><option>その他</option></select></label>
<label>区分<select id="category"><option>限定</option><option>恒常</option><option>コラボ</option></select></label>
<label>図鑑番号<input id="figure" type="number" min="0" placeholder="例：1234"></label>
<label>優先度<select id="priority"><option>⚪ 保留</option><option>🟡 余裕あれば</option><option>🟠 優先</option><option>🔴 最優先</option></select></label>
<label>キャラメモ<textarea id="charNote" rows="2"></textarea></label>
<label>所持個体数<input id="copyCountInput" type="number" min="0" max="30" value="1"></label>
</div><div id="copyEditors"></div>
<div class="foot"><button class="danger" id="delete">キャラ削除</button><div><button id="cancel">キャンセル</button><button class="primary" id="save">保存</button></div></div></dialog>
<input id="fileInput" type="file" accept="application/json" hidden>
<script>
const accountsDefault=["アカウント1","アカウント2","アカウント3","アカウント4"];
const grades=["特級","特級M","特級L","特級EL"];
const fruits=["同族加撃","同族加撃速","同族加命撃","同族加命","同族加速","撃種加撃","撃種加撃速","撃種加命撃","撃種加命","撃種加速","戦型加撃","戦型加撃速","戦型加命撃","戦型加命","戦型加速","熱き友撃","速必殺","将命削り","兵命削り","怪我減り","ちび癒し","毒がまん","ハート強化","スコア稼ぎ","学び","荒稼ぎ","Sランク","スピクリ","その他"];
const evo=["進化","神化","獣神化","獣神化・改","真獣神化","進化前","その他（自由入力）"];
const training=["レベルMAX","タスカン","運極","紋章","わくわくの実厳選","書・戦型解放","その他"];
const sets={"同撃3種":["同族加撃","同族加撃速","同族加命撃"],"戦撃3種":["戦型加撃","戦型加撃速","戦型加命撃"],"撃撃3種":["撃種加撃","撃種加撃速","撃種加命撃"],"指定なし":[]};
const colors={火:"#d94d45",水:"#347fc5",木:"#398653",光:"#a27a13",闇:"#7851b7"},bg={火:"#fde9e7",水:"#e7f2fc",木:"#e8f4eb",光:"#fbf3dc",闇:"#f0eafa"},emoji={火:"🔥",水:"💧",木:"🌿",光:"✨",闇:"🌙"};
let editorCopies=[],editorCopyIndex=0;
let accounts=JSON.parse(localStorage.getItem("monstAccounts")||"null")||accountsDefault;
let data=JSON.parse(localStorage.getItem("monstTracker")||"null")||[];
let status="all",view="list",editing=null,detailId=null,individualId=null,copyAccountFilter="";
const $=id=>document.getElementById(id);
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function normalize(){
 data=data.map(c=>({...c,category:c.category||"恒常",figureNumber:c.figureNumber??c.figure??"",priority:c.priority||"⚪ 保留",note:c.note||"",copies:(c.copies||[]).map(cp=>{
 let fruitsData=(cp.fruits||[]).map(f=>typeof f==="string"?{name:f,grade:"特級"}:{name:f.name,grade:f.grade||"特級"});
 return {...cp,id:cp.id||uid(),account:cp.account||accounts[0],evolution:cp.evolution||"",targetSet:cp.targetSet||"指定なし",customTargets:cp.customTargets||[],notes:cp.notes||"",plannedFruits:cp.plannedFruits||[],training:cp.training||{},fruits:fruitsData}
 })}));
}
normalize();
function save(){localStorage.setItem("monstTracker",JSON.stringify(data));localStorage.setItem("monstAccounts",JSON.stringify(accounts));render();if(detailId!==null)showDetail(detailId)}
function escape(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function accountUI(){let current=$("accountFilter").value;$("accountSettings").innerHTML=accounts.map((a,i)=>`<button class="chip soft" onclick="renameAccount(${i})">✏️ ${escape(a)}</button>`).join("")+'<small>タップでアカウント名変更</small>'; $("accountFilter").innerHTML='<option value="">アカウント：すべて</option>'+accounts.map(a=>`<option>${escape(a)}</option>`).join("");$("accountFilter").value=accounts.includes(current)?current:""}
window.renameAccount=i=>{let n=prompt("アカウント名を変更",accounts[i]);if(n?.trim()){let old=accounts[i];accounts[i]=n.trim();data.forEach(c=>c.copies.forEach(cp=>{if(cp.account===old)cp.account=n.trim()}));save()}};
function unfinished(c){return c.copies.some(cp=>!cp.training["レベルMAX"]||!cp.training["タスカン"]||!cp.training["わくわくの実厳選"])}
function render(){
 accountUI();let q=$("search").value.trim().toLowerCase(),ac=$("accountFilter").value,cat=$("categoryFilter").value,pri=$("priorityFilter").value;
 let arr=data.filter(c=>(status==="all"||status==="owned"&&c.copies.length||status==="unowned"&&!c.copies.length||status==="unfinished"&&unfinished(c)||status==="priority"&&c.priority.includes("優先")||status==="threeAttack"&&threeAttackCount(c)>0)&&(!q||c.name.toLowerCase().includes(q))&&(!ac||c.copies.some(cp=>cp.account===ac))&&(!cat||c.category===cat)&&(!pri||c.priority===pri));
 if($("sort").value==="figureAsc")arr.sort((a,b)=>(Number(a.figureNumber)||999999)-(Number(b.figureNumber)||999999));
 if($("sort").value==="figureDesc")arr.sort((a,b)=>(Number(b.figureNumber)||-1)-(Number(a.figureNumber)||-1));
 if($("sort").value==="name")arr.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
 if($("sort").value==="updated")arr.sort((a,b)=>(b.updated||0)-(a.updated||0));
 $("totalChars").textContent=data.length;$("ownedChars").textContent=data.filter(c=>c.copies.length).length;$("totalCopies").textContent=data.reduce((n,c)=>n+c.copies.length,0);
 $("todoCount").textContent=tasks().length;
 $("grid").innerHTML=arr.length?arr.map(c=>`<article class="card" onclick="showDetail(${c.id})"><div class="cardrow"><div class="element-icon" style="background:${bg[c.element]||'#eee'};color:${colors[c.element]||'#555'}">${emoji[c.element]||"⭐"}</div><div style="flex:1"><div class="name" style="color:${colors[c.element]||'#222'}">${escape(c.name)}</div><small>${escape(c.category)} ・ ${c.figureNumber?`図鑑 ${c.figureNumber} ・ `:""}${escape(c.element||"属性未設定")} ・ ${escape(c.rarity||"")}</small></div><span class="badge">${c.copies.length}体</span></div><div class="filters"><span class="priority">${escape(c.priority)}</span>${threeAttackCount(c)?`<span class="chip" style="background:#e5f5e9;color:#18723a;font-weight:700">🏅 3加撃完成 ${threeAttackCount(c)}体</span>`:''}${unfinished(c)?'<span class="chip">未完成</span>':''}</div></article>`).join(""):'<div class="empty">該当キャラがありません</div>';
 renderOther();
}
function target(cp){return cp.targetSet==="指定なし"?cp.customTargets:sets[cp.targetSet]||[]}
function completed(cp){let t=target(cp);return t.length>0&&t.every(f=>cp.fruits.some(x=>x.name===f))}
function threeAttackComplete(cp){return ["同撃3種","戦撃3種","撃撃3種"].includes(cp.targetSet)&&completed(cp)}
function threeAttackCount(c){return c.copies.filter(threeAttackComplete).length}
function tasks(){let out=[];data.forEach(c=>c.copies.forEach((cp,i)=>training.forEach(t=>{if(!cp.training[t])out.push({c,cp,i,t})})));return out}
function renderOther(){
 $("todayView").innerHTML='<h2>📅 今日やること</h2>'+ (tasks().slice(0,60).map(x=>`<div class="task"><label><input type="checkbox" onchange="markTask(${x.c.id},${x.cp.id},'${escape(x.t)}',this.checked)"> ${escape(x.c.name)} / ${escape(x.cp.account)} ${x.i+1}体目：${escape(x.t)}</label></div>`).join("")||'<div class="empty">未完了タスクなし！</div>');
 $("unfinishedView").innerHTML='<h2>未完成キャラ</h2>'+data.filter(unfinished).map(c=>`<div class="card" onclick="showDetail(${c.id})"><b>${escape(c.name)}</b> <small>${c.copies.length}体・${escape(c.priority)}</small></div>`).join("")||'<div class="empty">未完成キャラなし！</div>';
 $("plansView").innerHTML='<h2>🔮 将来つけたい実</h2>'+data.flatMap(c=>c.copies.map((cp,i)=>({c,cp,i}))).filter(x=>x.cp.plannedFruits.length).map(x=>`<div class="panel"><b>${escape(x.c.name)} — ${escape(x.cp.account)} ${x.i+1}体目</b>${x.cp.plannedFruits.map(p=>`<div class="planned">${escape(p.name)}・${escape(p.grade)} ${p.done?'✅完成':'⏳予定'}</div>`).join("")}</div>`).join("")||'<div class="empty">予定している実はありません</div>';
}
window.markTask=(cid,cpid,t,v)=>{let c=data.find(x=>x.id===cid),cp=c.copies.find(x=>x.id===cpid);cp.training[t]=v;c.updated=Date.now();save()};
function copyStatus(cp){if(completed(cp))return {label:"厳選完成",icon:"🟢"};let t=target(cp);let got=t.filter(f=>cp.fruits.some(x=>x.name===f)).length;if(got>0)return {label:"育成中",icon:"🟡"};let checks=training.filter(x=>cp.training[x]).length;if(checks>0)return {label:"育成中",icon:"🟡"};return {label:"未着手",icon:"⚪"}}
function copyProgress(cp){let t=target(cp);if(!t.length)return training.filter(x=>cp.training[x]).length;return t.filter(f=>cp.fruits.some(x=>x.name===f)).length/t.length}
function showDetail(id){detailId=id;let c=data.find(x=>x.id===id);if(!c)return;individualId=individualId&&c.copies.some(x=>x.id===individualId)?individualId:(c.copies[0]?.id||null);copyAccountFilter="";$("home").classList.add("hidden");$("detail").classList.remove("hidden");renderDetail()}
function renderDetail(){let c=data.find(x=>x.id===detailId);if(!c)return;let total=c.copies.length,done=c.copies.filter(completed).length,progress=c.copies.filter(cp=>copyStatus(cp).label==="育成中").length,selected=c.copies.find(cp=>cp.id===individualId)||c.copies[0];
 let accountTabs=['すべて',...accounts].map(a=>`<button class="chip ${copyAccountFilter===(a==='すべて'?'':a)?'active':''}" onclick="filterCopyAccount('${escape(a==='すべて'?'':a)}')">${escape(a)}</button>`).join("");
 let tiles=c.copies.map((cp,i)=>({cp,i})).filter(x=>!copyAccountFilter||x.cp.account===copyAccountFilter).map(({cp,i})=>{let st=copyStatus(cp),pct=Math.round(copyProgress(cp)*100);return `<button class="copytile ${cp.id===individualId?'selected':''}" onclick="selectIndividual(${cp.id})"><div class="num">${i+1}体目</div><div class="acct">${escape(cp.account)}</div>${threeAttackComplete(cp)?'<div class="state" style="color:#18723a;font-weight:800">🏅 3加撃完成</div>':''}<div class="state">${st.icon} ${st.label}</div>${target(cp).length?`<div class="progressbar"><span style="width:${pct}%"></span></div>`:''}</button>`}).join("");
 let idx=c.copies.findIndex(cp=>cp.id===selected?.id);let details=selected?`<div class="panel"><div class="detailhead"><h2 style="margin:0">${idx+1}体目</h2><span class="badge">${escape(selected.account)}</span><span class="badge">${copyStatus(selected).icon} ${copyStatus(selected).label}</span>${threeAttackComplete(selected)?'<span class="badge" style="background:#e5f5e9;color:#18723a">🏅 3加撃完成</span>':''}</div><p>進化状態：${escape(selected.evolution==='その他（自由入力）'?(selected.evolutionCustom||'その他（自由入力）'):(selected.evolution||'未設定'))}　／　厳選目標：${escape(selected.targetSet||"指定なし")}</p><h3>わくわくの実</h3><div>${selected.fruits.map(f=>`<span class="fruit">${escape(f.name)}・${escape(f.grade)}</span>`).join("")||'<small>実未設定</small>'}</div><h3>厳選進捗</h3>${target(selected).length?`<p>${target(selected).filter(f=>selected.fruits.some(x=>x.name===f)).length} / ${target(selected).length}個</p><div class="progressbar"><span style="width:${Math.round(copyProgress(selected)*100)}%"></span></div><ul>${target(selected).map(f=>`<li>${selected.fruits.some(x=>x.name===f)?'✅':'⬜'} ${escape(f)}</li>`).join("")}</ul>`:'<small>厳選目標は指定なし</small>'}<h3>育成チェック</h3><div class="checklist">${training.map(t=>`<label><input type="checkbox" ${selected.training[t]?'checked':''} onchange="setTraining(${c.id},${selected.id},'${escape(t)}',this.checked)"> ${escape(t)}</label>`).join("")}</div><h3>個体メモ</h3><p>${escape(selected.notes||"メモなし")}</p><h3>将来つけたい実</h3>${selected.plannedFruits.map(p=>`<div class="planned">${escape(p.name)}・${escape(p.grade)} ${p.done?'✅完成':'⏳予定'}</div>`).join("")||'<small>予定なし</small>'}<div class="navcopies"><button class="soft" onclick="moveIndividual(-1)" ${idx<=0?'disabled':''}>← 前の個体</button><button class="soft" onclick="moveIndividual(1)" ${idx>=total-1?'disabled':''}>次の個体 →</button></div><button class="primary" onclick="editChar(${c.id})">個体設定・実を編集</button></div>`:'<div class="empty">個体がありません</div>';
 $("detailContent").innerHTML=`<div class="panel"><h2 style="color:${colors[c.element]||'#222'}">${emoji[c.element]||"⭐"} ${escape(c.name)}</h2><div>${escape(c.category)} ・ ${escape(c.element||"未設定")} ・ ${escape(c.rarity)} ・ 図鑑 ${escape(c.figureNumber||"未登録")}</div><p class="priority">${escape(c.priority)}</p><p>${escape(c.note)}</p><div class="stats"><div class="stat"><strong>${total}</strong><small>所持個体</small></div><div class="stat"><strong>${done}</strong><small>厳選完成</small></div><div class="stat"><strong>${threeAttackCount(c)}</strong><small>3加撃完成個体</small></div><div class="stat"><strong>${progress}</strong><small>育成中</small></div><div class="stat"><strong>${total-done-progress}</strong><small>未着手</small></div></div><button class="soft" onclick="editChar(${c.id})">キャラ編集</button><button onclick="addCopy(${c.id})">＋個体追加</button></div><h3>所持個体一覧</h3><div class="copytabs">${accountTabs}</div><div class="copytiles">${tiles||'<div class="empty">該当個体なし</div>'}</div>${details}<div class="actions"><button class="danger" onclick="deleteChar(${c.id})">キャラ削除</button></div>`;
}
window.filterCopyAccount=a=>{copyAccountFilter=a;renderDetail()};window.selectIndividual=id=>{individualId=id;renderDetail()};window.moveIndividual=d=>{let c=data.find(x=>x.id===detailId),i=c.copies.findIndex(cp=>cp.id===individualId);if(c.copies[i+d]){individualId=c.copies[i+d].id;renderDetail()}};
window.setTraining=(cid,cpid,t,v)=>{let cp=data.find(c=>c.id===cid).copies.find(x=>x.id===cpid);cp.training[t]=v;save();if(detailId===cid)renderDetail()};
window.editChar=id=>openEditor(data.find(c=>c.id===id));
window.addCopy=id=>{let c=data.find(c=>c.id===id);c.copies.push(newCopy(accounts[0]));save()};
window.deleteChar=id=>{if(confirm("このキャラを削除しますか？")){data=data.filter(c=>c.id!==id);detailId=null;$("detail").classList.add("hidden");$("home").classList.remove("hidden");save()}};
function newCopy(account){return {id:uid(),account,evolution:"",targetSet:"指定なし",customTargets:[],fruits:[],plannedFruits:[],training:{},notes:""}}
function openEditor(c=null){editing=c?.id??null;$("editorTitle").textContent=c?"キャラ編集":"キャラ登録";$('name').value=c?.name||"";$('element').value=c?.element||"";$('rarity').value=c?.rarity||"★6";$('category').value=c?.category||"恒常";$('figure').value=c?.figureNumber||"";$('priority').value=c?.priority||"⚪ 保留";$('charNote').value=c?.note||"";$('copyCountInput').value=c?c.copies.length:1;editorCopies=(c?.copies||[newCopy(accounts[0])]).map(cp=>({...cp,fruits:[...(cp.fruits||[])],plannedFruits:[...(cp.plannedFruits||[])],training:{...(cp.training||{})}}));editorCopyIndex=0;buildCopies();$('delete').style.display=c?"inline-block":"none";$('editor').showModal()}
function captureEditorCopy(){let d=$('copyEditors').querySelector('.copyeditor');if(!d)return;let planned=[...d.querySelectorAll('.plans .planned')].map(p=>({name:p.querySelector('span').textContent.split(' / ')[0],grade:p.querySelector('span').textContent.split(' / ')[1],done:p.querySelector('.planDone').checked}));editorCopies[editorCopyIndex]={id:Number(d.dataset.id),account:d.querySelector('.ac').value,evolution:d.querySelector('.evo').value,evolutionCustom:d.querySelector('.evoCustom')?.value||'',targetSet:d.querySelector('.target').value,customTargets:[],notes:d.querySelector('.note').value,fruits:[...d.querySelectorAll('.fruitcb')].filter(cb=>cb.checked).map(cb=>({name:cb.value,grade:cb.parentElement.querySelector('.grade').value})),plannedFruits:planned,training:Object.fromEntries([...d.querySelectorAll('[data-training]')].map(x=>[x.dataset.training,x.checked]))}}
function buildCopies(){let n=Math.min(30,Math.max(0,Number($('copyCountInput').value)||0));while(editorCopies.length<n)editorCopies.push(newCopy(accounts[0]));editorCopies=editorCopies.slice(0,n);if(editorCopyIndex>=n)editorCopyIndex=Math.max(0,n-1);let tiles=`<div class="editorsection"><strong>編集する個体を選択（${n}体）</strong><div class="editorcopytiles">${editorCopies.map((cp,i)=>`<button type="button" class="editorcopytile ${i===editorCopyIndex?'active':''}" onclick="switchEditorCopy(${i})">${i+1}体目<small>${escape(cp.account||'未設定')}</small></button>`).join('')}</div></div>`;let cp=editorCopies[editorCopyIndex];if(!cp){$('copyEditors').innerHTML=tiles+'<p class="muted">個体数を設定してください。</p>';return}$('copyEditors').innerHTML=tiles+`<div class="copyeditor" data-id="${cp.id}"><h3>${editorCopyIndex+1}体目の設定</h3><div class="formgrid"><label>アカウント<select class="ac">${accounts.map(a=>`<option ${a===cp.account?'selected':''}>${escape(a)}</option>`).join('')}</select></label><label>進化状態<select class="evo">${evo.map(e=>`<option ${e===(cp.evolution==='その他（自由入力）'||cp.evolutionCustom?'その他（自由入力）':cp.evolution)?'selected':''}>${escape(e)}</option>`).join('')}</select><input class="evoCustom" type="text" placeholder="進化状態を入力（例：ワトソンα）" value="${escape(cp.evolutionCustom||'')}" style="${cp.evolution==='その他（自由入力）'||cp.evolutionCustom?'display:block;margin-top:8px;width:100%':'display:none;margin-top:8px;width:100%'}"></label><label>厳選目標<select class="target">${Object.keys(sets).map(s=>`<option ${s===cp.targetSet?'selected':''}>${s}</option>`).join('')}</select></label><label>個体メモ<textarea class="note">${escape(cp.notes||'')}</textarea></label></div><h4>わくわくの実</h4><div class="fruitchecks">${fruits.map(f=>{let found=cp.fruits.find(x=>x.name===f);return `<label><input type="checkbox" class="fruitcb" value="${escape(f)}" ${found?'checked':''}>${escape(f)}<select class="grade" ${found?'':'disabled'}>${grades.map(g=>`<option ${found&&found.grade===g?'selected':''}>${g}</option>`).join('')}</select></label>`}).join('')}</div><h4>予定の実</h4><div class="plans">${cp.plannedFruits.map(p=>`<div class="planned"><span>${escape(p.name)} / ${escape(p.grade)}</span><input type="checkbox" class="planDone" ${p.done?'checked':''}></div>`).join('')}</div><button type="button" class="addPlan soft">＋予定の実を追加</button><h4>育成チェック</h4><div class="miniTraining checklist">${training.map(t=>`<label><input type="checkbox" data-training="${escape(t)}" ${cp.training[t]?'checked':''}>${escape(t)}</label>`).join('')}</div></div>`;$('copyEditors').querySelectorAll('.fruitcb').forEach(cb=>cb.onchange=()=>cb.parentElement.querySelector('.grade').disabled=!cb.checked);$('copyEditors').querySelectorAll('.evo').forEach(sel=>sel.onchange=()=>{let inp=sel.parentElement.querySelector('.evoCustom');inp.style.display=sel.value==='その他（自由入力）'?'block':'none';if(sel.value!=='その他（自由入力）')inp.value=''});$('copyEditors').querySelectorAll('.addPlan').forEach(btn=>btn.onclick=()=>{captureEditorCopy();let name=prompt('予定の実の種類');if(!name)return;let grade=prompt('予定のランク（特級 / 特級M / 特級L / 特級EL）','特級L')||'特級';editorCopies[editorCopyIndex].plannedFruits.push({name,grade,done:false});buildCopies()})}
window.switchEditorCopy=i=>{captureEditorCopy();editorCopyIndex=i;buildCopies()};$('copyCountInput').onchange=()=>{captureEditorCopy();buildCopies()};function readCopies(){captureEditorCopy();return editorCopies}
$("addBtn").onclick=()=>openEditor();$("cancel").onclick=()=>$("editor").close();$("save").onclick=()=>{let name=$("name").value.trim();if(!name){alert("キャラ名を入力");return}let obj={name,element:$("element").value,rarity:$("rarity").value,category:$("category").value,figureNumber:$("figure").value,priority:$("priority").value,note:$("charNote").value,copies:readCopies(),updated:Date.now()};if(editing){Object.assign(data.find(c=>c.id===editing),obj)}else data.push({id:uid(),...obj});$("editor").close();save();if(detailId!==null)showDetail(detailId)};
$("delete").onclick=()=>{if(editing&&confirm("削除しますか？")){data=data.filter(c=>c.id!==editing);$("editor").close();detailId=null;$("detail").classList.add("hidden");$("home").classList.remove("hidden");save()}};
$("back").onclick=()=>{detailId=null;$("detail").classList.add("hidden");$("home").classList.remove("hidden")};
$("search").oninput=render;["accountFilter","categoryFilter","priorityFilter","sort"].forEach(id=>$(id).onchange=render);
document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{status=b.dataset.status;document.querySelectorAll("[data-status]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));["listView","todayView","unfinishedView","plansView"].forEach(id=>$(id).classList.add("hidden"));$(view==="list"?"listView":view==="today"?"todayView":view==="unfinished"?"unfinishedView":"plansView").classList.remove("hidden")});
$("backupBtn").onclick=()=>{let blob=new Blob([JSON.stringify({accounts,data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="monst-character-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("importBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);accounts=x.accounts||accounts;data=Array.isArray(x)?x:(x.data||[]);normalize();save();alert("バックアップを復元しました")}catch{alert("読み込み失敗：JSON形式を確認してください")}};r.readAsText(f);e.target.value=""};
render();
</script>
</body></html>
